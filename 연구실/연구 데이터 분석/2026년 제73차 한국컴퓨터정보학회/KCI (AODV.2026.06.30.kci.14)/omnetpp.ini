[General]
##########################################################
#                    Run / Cmdenv                        #
##########################################################
user-interface = Cmdenv
simtime-resolution = -11

cmdenv-express-mode = true
cmdenv-autoflush = false
cmdenv-status-frequency = 50s
cmdenv-interactive = false
fname-append-host = false
parallel-simulation = false

**.cmdenv-log-level = warn
image-path = ../../images
network = RSUExampleScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true
sim-time-limit = 100s

**.param-record-as-scalar = false
**.scalar-recording = false
**.vector-recording = false
**.*.hopCount.result-recording-modes = 

*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.moduleType = "vanettutorials.veins_inet.VeinsInetRoutingCar"
*.manager.launchConfig = xmldoc("map.launchd.xml")

*.playgroundSizeX = 450m
*.playgroundSizeY = 430m
*.playgroundSizeZ = 50m

*.annotations.draw = false

##########################################################
#                  PHY / MAC (802.11p)                  #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 200m
*.connectionManager.drawMaxIntfDist = true

*.*.wlan[0].opMode = "p"
*.*.wlan[0].radio.bandName = "5.9 GHz"
*.*.wlan[0].radio.channelNumber = 1
*.*.wlan[0].radio.bandwidth = 10MHz

*.*.wlan[0].radio.transmitter.power = 8mW
*.*.wlan[0].radio.receiver.sensitivity = -80dBm
*.*.wlan[0].radio.sinrAllLogEnabled = false
*.*.wlan[0].radio.cbrLogEnabled = true
*.*.wlan[0].radio.cbrWindow = 100ms
*.*.wlan[0].radio.cbrRecordStartTime = 30s
	

*.radioMedium.pathLoss.typename = "LogNormalShadowing"
**.radioMedium.mediumLimitCache.maxCommunicationRange = 200m
**.radioMedium.rangeFilter = "communicationRange"
**.radioMedium.neighborCache.typename = ""

##########################################################
#                         RSU                            #
##########################################################
*.rsu[*].numApps = 1
*.rsu[*].app[*].typename = "PingApp"
*.rsu[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.rsu[*].ipv4.configurator.interfaces = "wlan0"
*.rsu[*].app[0].startTime = uniform(30s,30s)
*.rsu[*].app[0].stopTime = uniform(100s,100s)
*.rsu[*].app[*].networkProtocol = "ipv4"
*.rsu[*].app[0].sendInterval = 10ms
*.rsu[0].app[0].srcAddr = "rsu[0](ipv4)"

##########################################################
#                         CARS                           #
##########################################################
*.node[*].numApps = 0
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "wlan0"
*.node[*].mobility.typename = "VeinsInetMobility"

**.hasStatus = true
*.*.router = "Aodv"

**.routing.dlDirectThresholdRrepEnabled = false
**.routing.dlDirectThresholdRrepFeatureSet = "raw4"
**.routing.dlDirectThresholdRrepNeighborNorm = 20
**.routing.dlDirectThresholdRrepHopNorm = 10
**.routing.dlDirectThresholdRrepThresholdMin = 0
**.routing.dlDirectThresholdRrepThresholdMax = 100
**.routing.dlDirectThresholdRrepMinThresholdGap = 5
**.routing.dlDirectThresholdRrepInputStandardizationEnabled = true
**.routing.dlDirectThresholdRrepOutputStandardizationEnabled = true
**.routing.dlDirectThresholdRrepHidden1Size = 256
**.routing.dlDirectThresholdRrepHidden2Size = 256
