**.routing.useBdStationCount = true
**.mobility.writeFcdPositions = true
**.routing.cbrRrepMetricsEnabled = true
**.routing.cbrRrepDecisionLogEnabled = true
**.routing.transmissionFailureDiagnosisLogEnabled = true
**.routing.cbrBasedRrepDirectRouteBypassEnabled = true

**.routing.dlDirectThresholdRrepDebugLogEnabled = true


**.wlan[*].mac.bdRepetitionEnabled = false
**.wlan[*].mac.bdRepetitionTarget = "rreq"
**.wlan[*].mac.bdRepetitions = 1

**.wlan[*].mac.bdStationMeasurementPeriod = 1s

**.mobility.enableMaxSpeedI = true
**.mobility.maxSpeedI = 10

rng-class = "cMersenneTwister"
seed-set = ${seed=1..1}
repeat = 1

